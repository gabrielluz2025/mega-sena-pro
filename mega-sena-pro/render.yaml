# Render.com Configuration
# This file configures automatic deployment on Render.com

services:
  - type: web
    name: mega-sena-pro
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: dados
      mountPath: /opt/render/project/src/dados_sistema
      sizeGB: 1
